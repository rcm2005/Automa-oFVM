# Snippet para incluir no seu bloco server do nginx
# Substitua fvm.exemplo.com pelo seu domínio real

server {
    listen 443 ssl;
    server_name fvm.exemplo.com;

    ssl_certificate     /etc/letsencrypt/live/fvm.exemplo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fvm.exemplo.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Limita acesso ao /trigger ao IP do ESP32
    location /trigger {
        allow  192.168.1.0/24;  # ajuste para o IP/sub-rede do ESP32
        deny   all;

        limit_req zone=trigger burst=3 nodelay;

        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}

# Rate limit zone (adicione no bloco http{} do nginx.conf principal)
# limit_req_zone $binary_remote_addr zone=trigger:1m rate=1r/m;

server {
    listen 80;
    server_name fvm.exemplo.com;
    return 301 https://$host$request_uri;
}
